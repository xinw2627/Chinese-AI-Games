<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game Arcade</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            text-align: center;
            padding: 40px;
        }
        h1 { color: #00ffcc; }
        .game-card {
            display: inline-block;
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin: 15px;
            width: 200px;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s;
        }
        .game-card:hover {
            transform: scale(1.05);
            background-color: #333333;
        }
    </style>
</head>
<body>
    <h1>🎮 My Game Collection</h1>
    <p>Select a game below to play!</p>

    <!-- Replace '#' with links to your game HTML files or subfolders -->
    <a href="#" class="game-card">
        <h2>Game 1</h2>
        <p>Description of Game 1</p>
    </a>

    <a href="#" class="game-card">
        <h2>Game 2</h2>
        <p>Description of Game 2</p>
    </a>
</body>
</html>
